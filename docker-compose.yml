name: neia-test-suite

services:
  peer-a:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - SIGNALING_URL=ws://host.docker.internal:9876
      - ROLE=PEER_A
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: node scripts/e2e-peer-test.js

  peer-b:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - SIGNALING_URL=ws://host.docker.internal:9876
      - ROLE=PEER_B
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: node scripts/e2e-peer-test.js
