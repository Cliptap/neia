name: neia-chaos-suite

services:
  peer-a-chaos:
    build:
      context: .
      dockerfile: Dockerfile.test
    cap_add:
      - NET_ADMIN
    environment:
      - SIGNALING_URL=ws://host.docker.internal:9876
      - ROLE=PEER_A
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "apt-get update && apt-get install -y iproute2 &&
             tc qdisc add dev eth0 root netem delay 50ms 10ms loss 5% &&
             node scripts/e2e-peer-test.js"

  peer-b-chaos:
    build:
      context: .
      dockerfile: Dockerfile.test
    cap_add:
      - NET_ADMIN
    environment:
      - SIGNALING_URL=ws://host.docker.internal:9876
      - ROLE=PEER_B
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "apt-get update && apt-get install -y iproute2 &&
             tc qdisc add dev eth0 root netem delay 50ms 10ms loss 5% &&
             node scripts/e2e-peer-test.js"
